[project]
name = "asset-finance-modeler"
version = "0.1.0"
description = "Comprehensive financial modeling engine for SaaS and other assets, exposed via MCP."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "numpy-financial>=1.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "jsonpath-ng>=1.6",
    "mcp>=1.0",
    "sentence-transformers>=2.6",
    "faiss-cpu>=1.8",
    "jinja2>=3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-snapshot>=0.9",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
asset-finance-modeler = "asset_finance_modeler.cli.main:main"
asset-finance-modeler-http = "asset_finance_modeler.mcp_server.http_server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asset_finance_modeler.assets.saas.presets" = ["*.yaml"]
"asset_finance_modeler.intelligence.knowledge.data" = ["*.yaml"]
"asset_finance_modeler.intelligence.workflows.templates" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "PL"]
ignore = ["PLR0913", "PLR0912", "PLR0917", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "PLR0913", "PLR0917"]
"src/asset_finance_modeler/mcp_server/tools/output.py" = ["PLR0911"]
"src/asset_finance_modeler/mcp_server/registry.py" = ["I001"]
"src/asset_finance_modeler/core/curves.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
