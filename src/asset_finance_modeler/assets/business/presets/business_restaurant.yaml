# Valores ilustrativos / de mercado: restaurante como negocio en marcha.
# Adquisición ~5x EBITDA (~0,84 M€) en lugar de solo la reforma, para que el
# ejemplo arroje una TIR de compra creíble (~21%) y un VAN razonable.
meta:
  name: "Restaurante"
  horizon:
    periods: 120
    frequency: M
revenue:
  - name: "Comidas"
    year1_amount: 600000
    growth_pct_yr: 0.03
  - name: "Bebidas"
    year1_amount: 200000
    growth_pct_yr: 0.03
cogs:
  pct_of_revenue: 0.32
opex:
  fixed_lines:
    - name: "Personal"
      year1_amount: 240000
    - name: "Alquiler"
      year1_amount: 60000
    - name: "Suministros"
      year1_amount: 36000
  variable_pct_of_revenue: 0.05
capex:
  items:
    - name: "Adquisición (fondo de comercio + reforma + equipamiento)"
      amount: 840000
      period: 0
      depreciation_years: 8
taxes:
  corporate_income_tax_rate: 0.25
valuation:
  discount_rate_annual: 0.12
