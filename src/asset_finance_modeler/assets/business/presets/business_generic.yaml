# Valores ilustrativos / de mercado: PYME genérica como negocio en marcha.
# Inversión de entrada ~0,9 M€ (no solo el capex operativo) para una TIR de
# compra creíble (~14%) y un VAN razonable a un descuento del 10%.
meta:
  name: "Negocio genérico"
  horizon:
    periods: 120
    frequency: M
revenue:
  - name: "Ventas"
    year1_amount: 1000000
    growth_pct_yr: 0.05
cogs:
  pct_of_revenue: 0.40
opex:
  fixed_lines:
    - name: "Personal"
      year1_amount: 300000
    - name: "Estructura"
      year1_amount: 120000
  variable_pct_of_revenue: 0.08
  escalation_pct_yr: 0.02
capex:
  items:
    - name: "Inversión inicial (adquisición + activos)"
      amount: 900000
      period: 0
      depreciation_years: 10
taxes:
  corporate_income_tax_rate: 0.25
valuation:
  discount_rate_annual: 0.10
