# Valores ilustrativos / de mercado: planta industrial en marcha. Inversión
# total ~5 M€ (terreno + nave + maquinaria) para una TIR de proyecto creíble
# (~15%), DSCR holgado (~2,2) y un VAN razonable a un descuento del 9%.
meta:
  name: "Planta industrial"
  horizon:
    periods: 120
    frequency: M
revenue:
  - name: "Producción"
    year1_amount: 5000000
    growth_pct_yr: 0.04
cogs:
  pct_of_revenue: 0.55
opex:
  fixed_lines:
    - name: "Mano de obra"
      year1_amount: 800000
    - name: "Mantenimiento"
      year1_amount: 300000
  variable_pct_of_revenue: 0.06
capex:
  items:
    - name: "Terreno + nave + maquinaria"
      amount: 5000000
      period: 0
      depreciation_years: 15
financing:
  senior:
    interest_rate: 0.05
    tenor_years: 8
    amortization: french
    auto_size: false
  max_leverage: 0.5
taxes:
  corporate_income_tax_rate: 0.25
valuation:
  discount_rate_annual: 0.09
