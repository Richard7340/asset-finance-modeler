meta:
  name: svj_fv_cordoba
  horizon:
    periods: 360
    frequency: M
  start_date: "2026-01-01"
  initial_cash: 0
  base_currency: EUR

production:
  type: solar_pv
  capacity_mwp: 4.76
  # CALIBRATION (Phase 6, Task 3): specific_yield_kwh_kwp already represents
  # NET specific production (post-PR, post-losses) per the validated Excel.
  # The solar engine multiplies yield * performance_ratio, so leaving PR<1
  # double-applies the performance ratio and under-counts production
  # (4.76*1582*0.86 = 6,476 MWh vs Excel target 7,530 MWh). We bake the PR
  # into the (already net) yield by setting performance_ratio: 1.0.
  # Result: 4.76 * 1582 * 1.0 = 7,530 MWh/yr (matches Excel).
  # See docs/superpowers/svj_validation_report.md.
  specific_yield_kwh_kwp: 1582
  performance_ratio: 1.0

revenue:
  - type: ppa
    name: PPA
    price_eur_per_unit: 43.0
    volume_fraction: 0.50
    escalation_pct_yr: 0.02
    tenor_years: 30
  - type: merchant
    name: Merchant
    base_price_eur_per_unit: 36.0
    volume_fraction: 0.50
    capture_ratio: 0.85
    escalation_pct_yr: -0.015

capex:
  items:
    - name: EPC (modules + BOS + installation)
      amount_per_unit: 0.93
      unit: Wp
      depreciation_years: 25
      depreciation_method: straight_line
  # CALIBRATION (Phase 6, Task 3): the validated Excel total_capex is ~€4.44M,
  # which is essentially EPC (4.76M Wp * 0.93 = €4,426,800) plus a thin
  # development allowance. Original preset extras (5% contingency + €100k dev +
  # €200k grid) inflated total_capex to €4.95M. Trimmed to match Excel.
  contingency_pct: 0.0
  development_cost: 13200
  grid_connection_cost: 0

opex:
  om_fixed_eur_per_mw_yr: 4000
  om_variable_eur_per_mwh: 0.5
  insurance_pct_capex: 0.0015
  land_lease_eur_yr: 3000
  management_fee_eur_yr: 2000
  opex_escalation_pct_yr: 0.02


degradation:
  type: time_based
  annual_rate: 0.006

timeline:
  development_months: 6
  permitting_months: 12
  construction_months: 8
  grid_connection_months: 3

financing:
  senior:
    tenor_years: 10
    interest_rate: 0.032
    amortization: french
    auto_size: false
  max_leverage: 0.50

taxes:
  corporate_income_tax_rate: 0.25
  tax_loss_carryforward: true

valuation:
  discount_rate_annual: 0.0537
  cost_of_equity_annual: 0.075
  terminal_growth_rate: 0.0
  terminal_method: gordon
