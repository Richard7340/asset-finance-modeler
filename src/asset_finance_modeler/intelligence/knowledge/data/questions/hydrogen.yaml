- field_path: meta.horizon.periods
  question: "¿Vida útil del proyecto de hidrógeno verde (años)?"
  help_text: "Plantas electrolizadoras: 20-25 años. Los stacks (electrolizadores) se reemplazan cada 80,000-100,000 horas (~10-12 años)."
  options:
    - label: "20 años (ciclo estándar)"
      value: 240
    - label: "25 años (con sustitución de stack)"
      value: 300
  required: true
  order: 0
  group: meta

- field_path: production.electrolyzer_capacity_mw
  question: "¿Capacidad del electrolizador (MW eléctricos)?"
  help_text: "Potencia eléctrica instalada. Proyectos piloto: 1-10 MW. Escala industrial: 50-500 MW."
  options:
    - label: "5 MW (piloto / demostración)"
      value: 5
    - label: "20 MW (escala pequeña)"
      value: 20
    - label: "100 MW (industrial)"
      value: 100
    - label: "300 MW (gran escala)"
      value: 300
  required: true
  order: 1
  group: production

- field_path: production.electrolyzer_technology
  question: "¿Tecnología del electrolizador?"
  help_text: "PEM = Protón Exchange Membrane (respuesta rápida, mayor coste). Alcalino = más maduro, menor coste. AEM = emergente."
  options:
    - label: "PEM (flexible, respuesta rápida)"
      value: "pem"
    - label: "Alcalino (maduro, menor coste)"
      value: "alkaline"
    - label: "AEM (emergente, alta eficiencia)"
      value: "aem"
  required: true
  order: 2
  group: production

- field_path: production.efficiency_kwh_per_kg
  question: "¿Eficiencia del electrolizador (kWh/kg H₂)?"
  help_text: "Energía eléctrica necesaria para producir 1 kg de H₂. PEM actual: 52-58 kWh/kg. Alcalino: 50-55 kWh/kg."
  options:
    - label: "50 kWh/kg (alcalino eficiente)"
      value: 50
    - label: "54 kWh/kg (PEM estándar)"
      value: 54
    - label: "58 kWh/kg (tecnología conservadora)"
      value: 58
  required: true
  order: 3
  benchmark_key: electrolyzer_efficiency_kwh_kg
  group: production

- field_path: production.availability_pct
  question: "¿Disponibilidad anual de la planta (%)?"
  help_text: "Incluye mantenimiento programado y paradas. Electrolizadores modernos con buen O&M: 92-97%."
  options:
    - label: "90% (planta nueva en rodaje)"
      value: 90
    - label: "95% (operación estable)"
      value: 95
    - label: "97% (O&M premium)"
      value: 97
  required: true
  order: 4
  group: production

- field_path: production.stack_lifetime_hours
  question: "¿Vida útil del stack del electrolizador (horas)?"
  help_text: "Antes de reemplazo del stack. PEM actual: 80,000-100,000 horas. Alcalino: 90,000-120,000 horas."
  options:
    - label: "80,000 h (~10 años a 8,000 h/año)"
      value: 80000
    - label: "90,000 h (~11 años)"
      value: 90000
    - label: "100,000 h (~12 años)"
      value: 100000
  required: false
  order: 5
  group: production
  expert_only: true

- field_path: production.electricity_source
  question: "¿Fuente de electricidad para el electrolizador?"
  help_text: "Sólo electricidad renovable = H₂ verde certificable (RFNBO). Con red eléctrica convencional = H₂ gris/amarillo."
  options:
    - label: "Solar/eólico dedicado (100% renovable)"
      value: "dedicated_re"
    - label: "Red eléctrica con PPAs renovables"
      value: "grid_ppa"
    - label: "Híbrido (renovable + red)"
      value: "hybrid"
  required: true
  order: 6
  group: production

- field_path: production.electricity_cost_eur_mwh
  question: "¿Coste de la electricidad (€/MWh)?"
  help_text: "El mayor coste operativo (~60-70% del OPEX). Solar dedicado: 25-40 €/MWh. Red/PPA: 40-70 €/MWh. Determina el coste de producción del H₂."
  options:
    - label: "25 €/MWh (solar PV dedicado propio)"
      value: 25
    - label: "40 €/MWh (PPA renovable)"
      value: 40
    - label: "55 €/MWh (red eléctrica + RECs)"
      value: 55
    - label: "70 €/MWh (red spot)"
      value: 70
  required: true
  order: 7
  benchmark_key: electricity_cost_hydrogen
  group: production

- field_path: revenue[0].price_eur_per_unit
  question: "¿Precio de venta del hidrógeno verde (€/kg)?"
  help_text: "H₂ verde España 2025-2026: 4-8 €/kg. Con subsidios H2Global/Horizon Europe: puede llegar a 3-5 €/kg para proyectos pioneros."
  options:
    - label: "3.5 €/kg (con subsidios máximos)"
      value: 3.5
    - label: "5 €/kg (mercado con contratos)"
      value: 5
    - label: "6.5 €/kg (precio referencia actual)"
      value: 6.5
    - label: "8 €/kg (aplicaciones de nicho / movilidad)"
      value: 8
  required: true
  order: 8
  benchmark_key: h2_offtake_price_eur_kg
  group: revenue

- field_path: revenue.rfnbo_certificates_eur_kg
  question: "¿Ingresos por certificados RFNBO/GO H₂ (€/kg)?"
  help_text: "Renewable Fuels of Non-Biological Origin. Mercado emergente: 0.5-2 €/kg. Transporte/refino puede pagar prima."
  options:
    - label: "0 (sin certificados)"
      value: 0
    - label: "0.5 €/kg (GO básico)"
      value: 0.5
    - label: "1.5 €/kg (RFNBO transporte)"
      value: 1.5
    - label: "2 €/kg (sector aéreo / marítimo)"
      value: 2
  required: false
  order: 9
  group: revenue

- field_path: revenue.waste_heat_eur_year
  question: "¿Ingresos por venta de calor residual (€/año)?"
  help_text: "El proceso de electrólisis genera calor recuperable. En entornos industriales puede venderse a redes de calor o procesos. Típico: 50,000-500,000 €/año según tamaño."
  options:
    - label: "0 (no aplica)"
      value: 0
    - label: "50,000 €/año"
      value: 50000
    - label: "200,000 €/año"
      value: 200000
    - label: "500,000 €/año (integración industrial)"
      value: 500000
  required: false
  order: 10
  group: revenue

- field_path: capex.electrolyzer_eur_per_kw
  question: "¿CAPEX del electrolizador (€/kW eléctrico instalado)?"
  help_text: "PEM 2025: 700-1200 €/kW. Alcalino: 500-900 €/kW. Incluye electrolizador, rectificador, BOS y commissioning."
  options:
    - label: "600 €/kW (alcalino optimizado)"
      value: 600
    - label: "900 €/kW (PEM mercado)"
      value: 900
    - label: "1200 €/kW (PEM premium / alta disponibilidad)"
      value: 1200
  required: true
  order: 11
  benchmark_key: capex_per_kw_electrolyzer
  group: capex

- field_path: capex.storage_compression_eur
  question: "¿CAPEX de almacenamiento y compresión (€)?"
  help_text: "Compresión a 200-700 bar + almacenamiento tampón. Típico: 10-30% del CAPEX total del electrolizador."
  options:
    - label: "Incluido en CAPEX/kW"
      value: 0
    - label: "500,000 € (pequeña escala)"
      value: 500000
    - label: "2,000,000 € (escala media)"
      value: 2000000
    - label: "10,000,000 € (almacenamiento grande)"
      value: 10000000
  required: false
  order: 12
  group: capex

- field_path: opex.stack_replacement_cost_pct_capex
  question: "¿Coste de reemplazo del stack (% del CAPEX electrolizador)?"
  help_text: "Cada vez que se agota la vida del stack. PEM: 30-50% del CAPEX. Se provisiona anualmente como mantenimiento mayor."
  options:
    - label: "30% (alcalino, piezas más baratas)"
      value: 0.30
    - label: "40% (PEM estándar)"
      value: 0.40
    - label: "50% (PEM con tecnología propietaria)"
      value: 0.50
  required: true
  order: 13
  group: opex
  expert_only: true

- field_path: opex.water_cost_eur_m3
  question: "¿Coste del agua desionizada (€/m³)?"
  help_text: "Se necesita ~9 litros de agua pura por kg de H₂. Agua desionizada: 2-10 €/m³. En zonas secas puede ser crítico."
  options:
    - label: "2 €/m³ (agua abundante)"
      value: 2
    - label: "5 €/m³ (zona semi-árida)"
      value: 5
    - label: "10 €/m³ (zona árida / desalinización)"
      value: 10
  required: false
  order: 14
  group: opex

- field_path: financing.max_leverage
  question: "¿Ratio deuda/equity?"
  help_text: "H₂ verde: activo de mayor riesgo (mercado naciente). Bancos financian 50-70% con offtake firmado. Sin contrato: difícil superar 50%."
  options:
    - label: "Sin deuda (100% equity / grants)"
      value: 0
    - label: "50% deuda"
      value: 0.50
    - label: "60% deuda (con offtake sólido)"
      value: 0.60
    - label: "70% deuda (offtake largo + garantías)"
      value: 0.70
  required: true
  order: 15
  group: financing

- field_path: financing.debt_tenor_years
  question: "¿Plazo de la deuda (años)?"
  help_text: "H₂ verde: 15-20 años con contrato de offtake. Alineado con vida del proyecto menos el residual."
  options:
    - label: "12 años"
      value: 12
    - label: "15 años"
      value: 15
    - label: "18 años"
      value: 18
  required: true
  order: 16
  group: financing

- field_path: financing.interest_rate_annual
  question: "¿Tipo de interés de la deuda (% anual)?"
  help_text: "H₂ verde España 2025-2026: 6-9% anual. Mayor prima por tecnología emergente y riesgo de mercado."
  options:
    - label: "6% (con garantías públicas / ICO)"
      value: 0.06
    - label: "7.5% (mercado con offtake)"
      value: 0.075
    - label: "9% (sin garantías, riesgo tecnológico)"
      value: 0.09
  required: true
  order: 17
  group: financing
  expert_only: true

- field_path: taxes.corporate_income_tax_rate
  question: "¿Tipo impositivo de sociedades?"
  help_text: "España: 25%. Proyectos H₂ pueden acceder a deducciones por I+D o inversiones medioambientales."
  options:
    - label: "25% (España estándar)"
      value: 0.25
    - label: "15% (startup / primeros años con beneficios)"
      value: 0.15
    - label: "21% (USA / jurisdicción alternativa)"
      value: 0.21
  required: true
  order: 18
  group: taxes

- field_path: valuation.discount_rate_annual
  question: "¿WACC para la valoración del proyecto?"
  help_text: "H₂ verde: mayor riesgo que solar/eólico. Con offtake: 8-12%. Sin contrato (merchant): 14-20%."
  options:
    - label: "8% (con subsidios + offtake largo)"
      value: 0.08
    - label: "12% (riesgo tecnológico moderado)"
      value: 0.12
    - label: "18% (early-stage, sin contratos)"
      value: 0.18
  required: true
  order: 19
  group: valuation
  expert_only: true

- field_path: custom_notes
  question: "¿Quieres añadir algún input adicional o nota especial?"
  help_text: "Puedes mencionar cualquier factor especial: subvenciones, restricciones, condiciones de mercado, etc."
  options:
    - label: "No, todo está definido"
      value: "none"
    - label: "Sí, quiero añadir algo"
      value: "custom"
  required: false
  order: 99
  group: custom
